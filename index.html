<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CABAÑAS - Tienda Online</title>
    <style>
        /* Estilo general minimalista y moderno */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
        }

        /* --- CABECERA (Limpia, blanca y negra) --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background-color: rgba(255, 255, 255, 0.98);
            position: sticky;
            top: 0;
            z-index: 1000;
            /* Sin borde inferior para un look más limpio */
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
        }

        .header-right {
            justify-content: flex-end;
        }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: #000;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* El logotipo centrado, fuente gruesa y junta */
        .logo {
            flex: 1;
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1px;
            color: #000;
            text-decoration: none;
        }

        .icon {
            font-size: 18px;
            cursor: pointer;
        }

        /* --- SECCIÓN HERO (Editorial, ocupa casi toda la pantalla) --- */
        .hero {
            position: relative;
            width: 100%;
            height: 90vh;
            background-color: #f5f5f5;
            overflow: hidden;
            display: flex;
            align-items: flex-end; /* Texto abajo */
            justify-content: center;
            padding-bottom: 60px;
        }

        .hero iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw; /* Ratio 16:9 */
            min-height: 100vh;
            min-width: 177.77vh; /* Ratio 16:9 */
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none; 
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 60%, rgba(0,0,0,0.4) 100%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #fff;
        }

        .hero-content h1 {
            font-size: 40px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 20px;
        }

        .btn-editorial {
            display: inline-block;
            background-color: #fff;
            color: #000;
            text-decoration: none;
            padding: 12px 32px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            border: 1px solid #fff;
            transition: all 0.3s;
        }

        .btn-editorial:hover {
            background-color: transparent;
            color: #fff;
        }

        /* --- BANNERS EDITORIALES (Estilo revista) --- */
        .editorial-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            margin: 2px 0;
        }

        .editorial-block {
            height: 70vh;
            background-color: #eaeaea;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 40px;
            cursor: pointer;
        }

        .editorial-block h2 {
            font-size: 28px;
            color: #fff;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: -1px;
            text-shadow: 1px 1px 10px rgba(0,0,0,0.3);
            z-index: 2;
        }

        /* --- CUADRÍCULA DE PRODUCTOS (Limpia, imágenes alargadas) --- */
        .product-section {
            padding: 40px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px; /* Menos espacio entre productos */
        }

        .product-card {
            cursor: pointer;
        }

        .product-image {
            background-color: #f2f2f2;
            aspect-ratio: 2/3; /* Formato retrato/alargado */
            margin-bottom: 12px;
            position: relative;
        }

        .add-to-cart {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .product-card:hover .add-to-cart {
            opacity: 1;
        }

        .product-info {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

            font-size
